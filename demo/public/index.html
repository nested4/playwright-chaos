<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaos Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1b1b1f; }
    h1 { margin-bottom: .25rem; } .tag { font-size: .8rem; color: #666; }
    ul { list-style: none; padding: 0; } li { display: flex; justify-content: space-between; align-items: center; padding: .6rem 0; border-bottom: 1px solid #eee; }
    button { padding: .45rem .9rem; border-radius: 6px; border: 1px solid #333; background: #fff; cursor: pointer; }
    button.primary { background: #1b1b1f; color: #fff; }
    .error { background: #fdecea; color: #8a1c13; padding: .6rem; border-radius: 6px; }
    .ok { background: #e7f6ec; color: #135c2b; padding: .6rem; border-radius: 6px; }
    .loading { color: #666; }
  </style>
</head>
<body>
  <h1>Chaos Shop</h1>
  <div class="tag">API client: <strong id="app-name" data-testid="app-name"></strong></div>

  <p class="loading" data-testid="loading">Loading products…</p>
  <ul data-testid="product-list"></ul>

  <p>Cart: <span data-testid="cart-count">0</span> item(s)</p>
  <button class="primary" data-testid="checkout" disabled>Checkout</button>

  <p>Orders placed: <span data-testid="orders-placed">0</span></p>
  <p data-testid="status" hidden></p>

  <script type="module" src="/shop.js"></script>
</body>
</html>
